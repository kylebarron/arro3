[workspace]
members = ["arro3-compute", "arro3-core", "arro3-io"]
# Note: we exclude pyo3-arrow from the top-level workspace because we have a
# circular dependency. pyo3-arrow is depended on by obstore to return arrow
# results as a list, which is depended on by arro3-io. This makes it hard to
# upgrade versions.
exclude = ["pyo3-arrow"]
resolver = "2"

[workspace.package]
# Package version for arro3-*, not for pyo3-arrow
version = "0.9.1"
authors = ["Kyle Barron <kylebarron2@gmail.com>"]
edition = "2021"
homepage = "https://kylebarron.dev/arro3"
repository = "https://github.com/kylebarron/arro3"
license = "MIT OR Apache-2.0"
keywords = ["python", "arrow"]
categories = []
rust-version = "1.75"

[workspace.dependencies]
arrow-arith = "60.1"
arrow-array = { version = "60.1", features = ["ffi"] }
arrow-buffer = "60.1"
arrow-cast = "60.1"
arrow-csv = "60.1"
arrow-ipc = { version = "60.1", features = ["lz4", "zstd"] }
arrow-json = "60.1"
arrow-schema = "60.1"
arrow-select = "60.1"
bytes = "1.7.0"
half = "2"
indexmap = "2.11"
numpy = "0.30"
object_store = "0.14"
parquet = "60.1"
pyo3 = { version = "0.30", features = ["macros", "indexmap"] }
pyo3-arrow = { path = "pyo3-arrow" }
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }
pyo3-bytes = "0.8"
pyo3-file = "0.18"
pyo3-object_store = "0.13"
thiserror = "1.0.63"

[profile.release]
lto = true
codegen-units = 1
